# Crowdin GitHub Integration configuration file
# https://support.crowdin.com/github-integration/

project_id_env: CROWDIN_PROJECT_ID
api_token_env: CROWDIN_PERSONAL_TOKEN

# Files configuration
files:
  - source: /lib/src/localization/app_ja.arb
    translation: /lib/src/localization/app_%locale%.arb
    languages_mapping:
      locale:
        en: en
        ja: ja
