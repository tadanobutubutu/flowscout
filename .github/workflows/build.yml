name: Flowscout CI/CD Orchestrator

on:
  push:
    branches:
      - master
      - dev
  pull_request:
    branches:
      - master
      - dev

jobs:
  # 1. 静的解析と自動テストジョブ (QA)
  lint-and-test:
    name: Code Quality & Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK)
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify Code Formatting
        run: dart format lib/

      - name: Static Analysis (Linter)
        run: flutter analyze

      - name: Run Automated Tests
        run: flutter test

  # 2. ビルド＆デプロイジョブ (テスト成功時のみ実行)
  build-and-deploy:
    name: Build mobile apps
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    needs: lint-and-test
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK)
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Android ビルド
      - name: Build Android APK
        run: flutter build apk --release

      - name: Build Android App Bundle (AAB)
        run: flutter build appbundle --release

      # iOS ビルド
      - name: Build iOS IPA
        run: flutter build ipa --release --no-codesign

      # ブランチごとのビルド成果物管理 (Dev vs Release)
      # masterへのマージやPushの際のみ自動でGitHub Releasesを作成
      - name: Create GitHub Release and Upload Artifacts (Master Release)
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: Flowscout Release v1.0.0+${{ github.run_number }}
          draft: false
          prerelease: false
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
