name: 💯 Diagnostics Gate

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
  diagnostics:
    name: 💎 Quality, Coverage & a11y Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # SonarCloud requires full history for better analysis

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Static Analysis (Linter)
        run: flutter analyze

      - name: Run Tests with Coverage
        run: flutter test --coverage

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage/lcov.info
          fail_ci_if_error: false # Don't fail the build if Codecov has transient errors



  security-codeql:
    name: 🛡️ Security CodeQL Scan
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: 'javascript-typescript' # Scans action definitions and javascript components

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
