<!DOCTYPE html>
<html>
<head>
  <title>Redirecting to GitHub App Creation...</title>
</head>
<body>
  <p>GitHub App の自動設定画面へリダイレクトしています...</p>
  <form id="manifestForm" action="https://github.com/settings/apps/new" method="post">
    <input type="hidden" name="manifest" value='{"name": "Flowscout Monitor", "url": "https://github.com/tadanobutubutu/flowscout", "hook_attributes": {"active": false}, "redirect_url": "https://flowscout-oauth.tadanobutubutu.workers.dev/setup-success", "callback_urls": ["https://flowscout-oauth.tadanobutubutu.workers.dev/callback"], "default_permissions": {"metadata": "read", "actions": "read", "members": "read"}, "default_events": []}'>
  </form>
  <script>
    document.getElementById('manifestForm').submit();
  </script>
</body>
</html>
